<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Project checklist</title>
<style>
  :root { --ink:#1b2a4a; --teal:#2f8fb0; --bg:#f6f8fa; --card:#fff; --line:#e2e8ee; --mute:#6b7785; --ok:#1f9d63; --warn:#c2571a; --bad:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button { font:inherit; }
  main { width:100%; max-width:1360px; margin:0 auto; padding:40px 20px 80px; }
  .off { background:#fff7ed; border:1px solid #f3d3b4; color:var(--warn); border-radius:12px; padding:14px 18px; max-width:640px; }

  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:20px; }
  .who { color:var(--teal); font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px; }
  h1 { font-size:30px; line-height:1.2; margin:0; }
  .today { margin:6px 0 0; color:var(--mute); font-size:15px; } .today b { color:var(--ink); font-weight:600; }
  .prog { display:flex; align-items:center; gap:14px; font-size:14px; color:var(--mute); min-width:260px; flex:1; max-width:380px; }
  .prog .bar { flex:1; height:8px; border-radius:4px; background:var(--line); overflow:hidden; } .prog .bar i { display:block; height:100%; background:var(--teal); transition:width .4s; }

  .tabs { display:inline-flex; gap:4px; padding:4px; background:#e9eef3; border-radius:12px; margin-bottom:18px; }
  .tabs button { border:0; background:none; font-size:14.5px; font-weight:600; color:var(--mute); padding:8px 16px; border-radius:9px; cursor:pointer; }
  .tabs button[aria-selected="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(27,42,74,.12); }
  .tabs b { background:var(--teal); color:#fff; border-radius:8px; font-size:12px; padding:1px 7px; margin-left:4px; }

  /* One step at a time on the right, every step listed on the left. */
  .wiz { display:grid; grid-template-columns:340px minmax(0,1fr); gap:24px; align-items:start; }
  .rail { position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:8px 10px 12px; }
  @media (max-width:860px) { .wiz { grid-template-columns:1fr; } .rail { position:static; max-height:none; order:2; } }
  .grp > p { margin:14px 8px 6px; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--teal); display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .grp > p span { flex:none; white-space:nowrap; color:var(--mute); font-weight:400; letter-spacing:0; text-transform:none; }
  .rail ol { list-style:none; margin:0; padding:0; }
  .rail button { width:100%; display:flex; align-items:center; gap:10px; text-align:left; background:none; border:0; border-radius:10px; padding:8px; font-size:14px; color:var(--ink); cursor:pointer; }
  .rail button:hover { background:#f1f5f8; }
  .rail button[aria-current="step"] { background:#e6f2f7; font-weight:600; }
  .rail button i { flex:none; width:20px; height:20px; border-radius:50%; border:2px solid #c5d0da; display:grid; place-items:center; font-style:normal; font-size:11px; color:#fff; }
  .rail button.done i { background:var(--ok); border-color:var(--ok); } .rail button.late i { border-color:var(--bad); }
  .rail button span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail button.done span { color:var(--mute); }
  .rail button small { flex:none; font-size:11.5px; color:var(--mute); } .rail button.late small { color:var(--bad); font-weight:600; }

  .panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:32px 36px; min-height:480px; }
  .panel.done { border-color:#bfe5d2; } .panel.late { border-color:#eab8b1; }
  @media (max-width:640px) { .panel { padding:22px 18px; } }
  .count { margin:0 0 8px; color:var(--teal); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .ptitle { margin:0 0 10px; font-size:26px; line-height:1.25; }
  .pdue { margin:0 0 20px; }
  .pdue em { font-style:normal; font-size:13px; font-weight:600; color:var(--mute); background:#eef2f6; border-radius:8px; padding:4px 10px; }
  .pdue em.ok { color:var(--ok); background:#e7f6ee; } .pdue em.bad { color:var(--bad); background:#fbeae8; }
  .act { display:flex; flex-direction:column; gap:12px; }
  .act label.lab { font-size:13.5px; font-weight:600; }

  .zone { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:22px 16px; border:1.5px dashed #b9c6d2; border-radius:12px; background:#fff; color:var(--mute); font-size:14.5px; cursor:pointer; transition:.15s; }
  .zone:hover, .zone.over { border-color:var(--teal); background:#f0f8fb; color:var(--ink); } .zone.over { border-style:solid; }
  .zone input { position:absolute; opacity:0; width:1px; height:1px; } .zone:focus-within { outline:2px solid var(--teal); outline-offset:2px; }
  .zone svg { color:var(--teal); } .zone b { color:var(--ink); font-weight:600; } .zone u { color:var(--teal); text-underline-offset:2px; } .zone small { font-size:12.5px; }
  .pick { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .pick li { display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; }
  .pick li span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .pick li small { flex:none; color:var(--mute); font-size:12.5px; }
  .pick li.was { background:#f3faf6; border-color:#cfe9dc; } .pick li.was small { color:var(--ok); }
  .pick li.err { border-color:#eab8b1; color:var(--bad); }
  .pick li button { flex:none; width:24px; height:24px; border:0; border-radius:6px; background:none; color:var(--mute); font-size:18px; line-height:1; cursor:pointer; }
  .pick li button:hover { background:#fbeae8; color:var(--bad); }
  textarea { width:100%; min-height:120px; resize:vertical; border:1px solid #cfd8e0; border-radius:9px; padding:10px 12px; font:inherit; font-size:15px; color:var(--ink); }
  textarea:focus { outline:2px solid var(--teal); outline-offset:1px; border-color:transparent; }
  .btn { align-self:flex-start; background:var(--ink); color:#fff; border:0; border-radius:9px; padding:10px 18px; font-size:14.5px; font-weight:500; cursor:pointer; }
  .btn:hover { background:#27406e; } .btn:disabled { opacity:.5; cursor:default; }
  .state { margin:0; font-size:14px; color:var(--mute); } .state.bad { color:var(--bad); } .state.ok { color:var(--ok); }
  .pnav { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .ghost { background:none; border:1px solid var(--line); border-radius:9px; padding:9px 16px; font-size:14.5px; font-weight:500; color:var(--ink); cursor:pointer; }
  .ghost:hover:not(:disabled) { border-color:var(--teal); } .ghost:disabled { opacity:.4; cursor:default; }
  .rail button:focus-visible, .ghost:focus-visible, .btn:focus-visible, .tabs button:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }

  .ver { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; }
  .ver summary { list-style:none; cursor:pointer; padding:16px 20px; display:flex; align-items:baseline; gap:12px; font-weight:600; font-size:17px; }
  .ver summary::-webkit-details-marker { display:none; }
  .ver summary small { color:var(--mute); font-weight:400; font-size:14px; } .ver summary em { margin-left:auto; font-style:normal; font-size:13px; color:var(--mute); font-weight:500; }
  .ver.full summary em { color:var(--ok); }
  .ver .in { padding:0 20px 18px; } .ver h4 { margin:12px 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .ver ul { margin:0; padding-left:20px; } .ver li { padding:2px 0; }
  .chk { display:flex; gap:10px; padding:7px 0; cursor:pointer; border-top:1px solid var(--line); }
  .chk input { width:18px; height:18px; margin-top:3px; accent-color:var(--ok); flex:none; } .chk:has(:checked) span { color:var(--mute); }
  footer { margin-top:40px; color:var(--mute); font-size:13.5px; }
</style>

<main id="app"><p class="state">…</p></main>

<script src="../config.js"></script>
<script>
// The client's private page. It only works in cloud mode (see cloud/README.md): the token after the # identifies the project.
// The client can read their own list and add files, answers and ticks. Nothing else: the rules are in the database.
const C = window.CLOUD || {}, MAX = 50 * 1024 * 1024, DAY = 864e5;
const token = /^[\w-]{32,128}$/.test(location.hash.slice(1)) ? location.hash.slice(1) : '';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');   // project and client text is never trusted as HTML
const safe = n => n.normalize('NFD').replace(/[^\w.-]+/g, '_').slice(-80);
const size = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const head = { apikey: C.key, Authorization: 'Bearer ' + C.key };
const rpc = (fn, body) => fetch(`${C.url}/rest/v1/rpc/skilltree_${fn}`, { method: 'POST', headers: { ...head, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  .then(async r => { if (!r.ok) throw new Error(r.status); const t = await r.text(); return t ? JSON.parse(t) : null; });

// D = what the server returned. The rest is what is on screen: which tab, which step, files chosen but not sent yet.
let D, EN = true, tab = 'steps', cur, pending = [], draft = '', errors = [], busy = false;
const tr = (it, en) => EN ? en : it;
const fmt = (d, o) => new Date(d).toLocaleDateString(EN ? 'en-GB' : 'it-IT', o);
const mine = id => D.sent.filter(s => s.request_id === id);
const done = r => mine(r.id).length > 0 || D.received.includes(r.id);
// A step is due at the end of its week: Friday of week w, counting from the project's start date.
const due = r => D.start && r.w > 0 ? new Date(+new Date(D.start) + ((r.w - 1) * 7 + 5) * DAY) : null;
const late = r => { const d = due(r); return !!d && !done(r) && +d < Date.now(); };
const dueText = r => { const d = due(r); return r.w === 0 ? tr('Serve per iniziare', 'Needed to start') : d ? tr('Serve entro ', 'Needed by ') + fmt(+d - DAY, { weekday: 'long', day: 'numeric', month: 'long' }) : tr('Settimana ', 'Week ') + r.w; };
const groupName = w => w === 0 ? tr('Prima di partire', 'Before kickoff') : tr('Settimana ', 'Week ') + w;

function render() {
  const items = D.requests.items, idx = Math.max(0, items.findIndex(r => r.id === cur)), r = items[idx];
  const n = items.filter(done).length, weeks = [...new Set(items.map(x => x.w))].sort((a, b) => a - b);
  const week = D.start && Date.now() >= +new Date(D.start) ? Math.floor((Date.now() - +new Date(D.start)) / (7 * DAY)) + 1 : 0;
  const next = items.find((x, i) => i > idx && !done(x)) || items.find(x => !done(x) && x.id !== r.id);
  const sent = mine(r.id), isDone = done(r), isLate = late(r);

  const steps = `<div class="wiz">
    <nav class="rail" aria-label="${tr('Tutti i passi', 'All steps')}">${weeks.map(w => { const g = items.filter(x => x.w === w); return `
      <div class="grp"><p>${groupName(w)}<span>${g.filter(done).length} ${tr('di', 'of')} ${g.length}</span></p><ol>${g.map(x => `
        <li><button type="button" class="${done(x) ? 'done' : late(x) ? 'late' : ''}" data-go="${esc(x.id)}" ${x.id === r.id ? 'aria-current="step"' : ''}>
          <i aria-hidden="true">${done(x) ? '✓' : ''}</i><span>${esc(x.t)}</span><small>${done(x) ? tr('fatto', 'done') : late(x) ? tr('in ritardo', 'late') : ''}</small></button></li>`).join('')}</ol></div>`; }).join('')}
    </nav>
    <section class="panel ${isDone ? 'done' : isLate ? 'late' : ''}" aria-labelledby="st">
      <p class="count">${tr('Passo', 'Step')} ${idx + 1} ${tr('di', 'of')} ${items.length}${D.requests.fasi?.[r.per] ? ' · ' + esc(D.requests.fasi[r.per]) : ''}</p>
      <h2 id="st" class="ptitle">${esc(r.t)}</h2>
      <p class="pdue">${D.received.includes(r.id) ? `<em class="ok">${tr('Ricevuto', 'Received')}</em>` : isDone ? `<em class="ok">${tr('Inviato', 'Sent')}</em>` : `<em class="${isLate ? 'bad' : ''}">${isLate ? tr('In ritardo · ', 'Late · ') : ''}${dueText(r)}</em>`}</p>
      <div class="act">
        <label class="zone" id="zone">
          <input type="file" multiple id="files">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
          <span><b>${tr('Trascinate qui i file', 'Drop files here')}</b> ${tr('oppure', 'or')} <u>${tr('sceglieteli dal computer', 'choose them from your computer')}</u></span>
          <small>${tr('Anche più di uno · fino a 50 MB l\'uno', 'More than one is fine · up to 50 MB each')}</small>
        </label>
        ${sent.length || pending.length || errors.length ? `<ul class="pick">
          ${sent.map(f => `<li class="was"><span>${esc(f.name)}</span><small>${tr('inviato', 'sent')}</small></li>`).join('')}
          ${pending.map((f, i) => `<li><span>${esc(f.name)}</span><small>${size(f.size)}</small><button type="button" data-rm="${i}" aria-label="${tr('Togli', 'Remove')} ${esc(f.name)}">×</button></li>`).join('')}
          ${errors.map(e => `<li class="err"><span>${esc(e)}</span></li>`).join('')}</ul>` : ''}
        <label class="lab" for="note">${tr('Risposta scritta (se serve)', 'Written answer (if needed)')}</label>
        <textarea id="note" maxlength="5000">${esc(draft)}</textarea>
        <button class="btn" id="send" ${busy ? 'disabled' : ''}>${busy ? tr('Invio…', 'Sending…') : tr('Invia', 'Send')}</button>
      </div>
      <div class="pnav">
        <button type="button" class="ghost" ${idx === 0 ? 'disabled' : `data-go="${esc(items[idx - 1].id)}"`}>← ${tr('Indietro', 'Back')}</button>
        ${next ? `<button type="button" class="${isDone ? 'btn' : 'ghost'}" data-go="${esc(next.id)}">${isDone ? tr('Prossimo passo', 'Next step') : tr('Salta per ora', 'Skip for now')} →</button>` : `<span class="state ok">${isDone ? tr('Tutto completato. Grazie.', 'All done. Thank you.') : ''}</span>`}
      </div>
    </section></div>`;

  const releases = D.releases.slice().reverse().map((v, i) => { const ck = D.checks[v.v] || {}, k = Object.keys(ck).length, tot = v.controlli.length; return `
    <details class="ver ${tot && k === tot ? 'full' : ''}" data-v="${esc(v.v)}" ${i === 0 ? 'open' : ''}>
      <summary>${tr('Versione', 'Version')} ${esc(v.v)}<small>${esc([v.titolo, v.data].filter(Boolean).join(' · '))}</small><em>${k} ${tr('di', 'of')} ${tot} ${tr('controllati', 'checked')}</em></summary>
      <div class="in"><h4>${tr('Cosa c\'è di nuovo', 'What is new')}</h4><ul>${v.novita.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <h4>${tr('Da controllare', 'To check')}</h4>${v.controlli.map((t, j) => `<label class="chk"><input type="checkbox" data-ck="${j}" ${ck[j] ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div></details>`; }).join('');

  $('#app').innerHTML = `<header class="top"><div>
      <p class="who">${esc(D.name)}</p><h1>${tr('Cosa serve per il progetto', 'What the project needs')}</h1>
      <p class="today">${tr('Oggi è ', 'Today is ')}${fmt(Date.now(), { weekday: 'long', day: 'numeric', month: 'long' })} · ${week ? `<b>${tr('settimana', 'week')} ${week} ${tr('del progetto', 'of the project')}</b>` : tr('le scadenze partono all\'avvio del progetto', 'deadlines start when the project kicks off')}</p></div>
      <div class="prog" role="status"><span>${n} ${tr('di', 'of')} ${items.length} ${tr('passi completati', 'steps done')}</span><div class="bar"><i style="width:${n / items.length * 100}%"></i></div></div></header>
    ${D.releases.length ? `<div class="tabs" role="tablist"><button role="tab" data-tab="steps" aria-selected="${tab === 'steps'}">${tr('Passi da completare', 'Steps to complete')}</button><button role="tab" data-tab="rel" aria-selected="${tab === 'rel'}">${tr('Versioni da provare', 'Releases to try')} <b>${D.releases.length}</b></button></div>` : ''}
    ${tab === 'rel' ? releases : steps}
    <footer>${tr('Pagina riservata. Quello che viene caricato è visibile solo a chi segue il progetto.', 'Private page. What you upload is visible only to whoever runs the project.')}</footer>`;
}

async function send() {
  const id = cur, label = tr('Risposta scritta', 'Written answer'), note = $('#note').value.trim();
  if (!pending.length && !note) return;
  busy = true; errors = []; draft = note; render();
  for (const f of pending.splice(0)) {
    try {
      if (f.size > MAX) throw new Error('big');
      const path = [token, id, Date.now() + '-' + safe(f.name)].join('/');
      const r = await fetch(`${C.url}/storage/v1/object/skilltree/${path}`, { method: 'POST', body: f, headers: { ...head, 'Content-Type': f.type || 'application/octet-stream', 'x-upsert': 'false' } });
      if (!r.ok) throw new Error(r.status);
      await rpc('client_sent', { p_token: token, p_request: id, p_name: f.name.slice(0, 200), p_path: path });
      D.sent.push({ request_id: id, name: f.name });
    } catch (e) { errors.push(f.name + (e.message === 'big' ? tr(': supera i 50 MB', ': larger than 50 MB') : tr(': invio non riuscito, riprovate', ': not sent, please try again'))); }
  }
  if (note) {
    try { await rpc('client_sent', { p_token: token, p_request: id, p_name: label, p_note: note.slice(0, 5000) }); D.sent.push({ request_id: id, name: label }); draft = ''; }
    catch { errors.push(label + tr(': invio non riuscito, riprovate', ': not sent, please try again')); }
  }
  busy = false; render();
}
// Changing step drops what was chosen but not sent: it belongs to the step it was chosen in.
const go = id => { cur = id; pending = []; draft = ''; errors = []; render(); $('.panel')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) go(b.dataset.go);
  else if (b.dataset.tab) { tab = b.dataset.tab; render(); }
  else if (b.dataset.rm) { draft = $('#note').value; pending.splice(+b.dataset.rm, 1); render(); }
  else if (b.id === 'send') send();
});
document.addEventListener('change', async e => {
  if (e.target.id === 'files') { draft = $('#note').value; pending.push(...e.target.files); errors = []; return render(); }
  const i = e.target.dataset.ck; if (i === undefined) return;
  const el = e.target.closest('.ver'), v = el.dataset.v, on = e.target.checked;
  try {
    await rpc('client_check', { p_token: token, p_version: v, p_index: +i, p_on: on });
    on ? (D.checks[v] ??= {})[i] = 1 : delete D.checks[v]?.[i];
    render();
  } catch { e.target.checked = !on; alert(tr('Spunta non salvata, riprovate.', 'Tick not saved, please try again.')); }
});
for (const ev of ['dragover', 'dragleave', 'drop']) document.addEventListener(ev, e => {
  const z = e.target.closest?.('#zone'); if (!z) return;
  e.preventDefault(); z.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop') { draft = $('#note').value; pending.push(...e.dataTransfer.files); errors = []; render(); }
});

(async () => {
  const bad = '<div class="off">This link is not valid or no longer active. Ask whoever runs your project for a new one.<br>Questo link non è valido o non è più attivo. Chiedete un nuovo link a chi segue il progetto.</div>';
  if (!token || !C.url) return $('#app').innerHTML = bad;
  try { D = await rpc('client_get', { p_token: token }); } catch {}
  if (!D) return $('#app').innerHTML = bad;
  EN = D.lang !== 'it'; document.documentElement.lang = EN ? 'en' : 'it'; document.title = D.name;
  // Open on the first step still to do.
  cur = (D.requests.items.find(r => !done(r)) || D.requests.items[0]).id;
  render();
})();
</script>
</html>
